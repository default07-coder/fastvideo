services:
  - type: web
    name: fastvideo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: YTDLP_PYTHON
        value: /opt/yt/bin/python
      - key: FILE_TTL_MINUTES
        value: "120"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "2048"
